      port: 4001
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /ready
      port: 4001
      initialDelaySeconds: 10
