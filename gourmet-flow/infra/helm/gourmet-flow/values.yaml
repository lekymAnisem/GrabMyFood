# ── Global settings ────────────────────────────────────────────────
namespace: gourmet-flow
nameOverride: ""
fullnameOverride: ""

imageRegistry: ""

global:
  nodeEnv: "production"
  jwtAccessExpiration: "15m"
  jwtRefreshExpiration: "7d"
  configMapName: "gourmet-flow-config"
  secretName: "gourmet-flow-secrets"

# ── Secrets (store in Vault or sealed-secrets in production) ──────
secrets:
  jwtSecret: "change-me"
  jwtRefreshSecret: "change-me"
  authDatabaseUrl: "postgresql://user:pass@host:5432/auth"
  userDatabaseUrl: "postgresql://user:pass@host:5432/user"
  restaurantDatabaseUrl: "postgresql://user:pass@host:5432/restaurant"
  menuDatabaseUrl: "postgresql://user:pass@host:5432/menu"
  cartDatabaseUrl: "postgresql://user:pass@host:5432/cart"
  orderDatabaseUrl: "postgresql://user:pass@host:5432/order"
  paymentDatabaseUrl: "postgresql://user:pass@host:5432/payment"
  deliveryDatabaseUrl: "postgresql://user:pass@host:5432/delivery"

# ── Services ──────────────────────────────────────────────────────
# Each key becomes the component label.  The generic deployment.yaml
# and service.yaml templates iterate over this map.
services:
  apiGateway:
    enabled: true
    name: api-gateway
    port: 4000
    replicas: 2
    serviceType: ClusterIP
    image:
      repository: letshop-production-backend
      tag: "api-gateway-latest"
      pullPolicy: IfNotPresent
    envVars:
      PORT: "4000"
    livenessProbe:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
    readinessProbe:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"

  authService:
    enabled: true
    name: auth-service
    port: 4001
    replicas: 2
    serviceType: ClusterIP
    image:
