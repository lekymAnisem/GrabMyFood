    port: 80
    replicas: 2
    serviceType: ClusterIP
    image:
      repository: letshop-production-frontend
      tag: "frontend-latest"
      pullPolicy: IfNotPresent
    envVars:
      VITE_API_GATEWAY_URL: "/api"
    livenessProbe:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 15
    readinessProbe:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    # Frontend-specific flags consumed by templates
    nginxConfigMap: "frontend-nginx-config"
    skipEnvFrom: true

# ── Ingress ──────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
  rules:
    - host: gourmet-flow.local
      paths:
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
  tls: []
