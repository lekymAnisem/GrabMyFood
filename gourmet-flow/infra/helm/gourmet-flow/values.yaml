        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    nginxConfigMap: "frontend-nginx-config"
    skipEnvFrom: true
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  rules:
    - paths:
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
        - path: /api
          pathType: Prefix
          serviceName: api-gateway
          servicePort: 4000
  tls: []
metrics:
  enabled: true
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  serviceMonitor:
    enabled: false
    labels: {}
serviceAccount:
  create: true
  name: gourmet-flow
  annotations: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
nodeSelector: {}
tolerations: []
affinity: {}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
