# GrabMyFood Helm values
# Environment: production
# Namespace: gourmet-flow

namespace: gourmet-flow
nameOverride: ""
fullnameOverride: ""
imageRegistry: "630243422439.dkr.ecr.ap-southeast-2.amazonaws.com"
global:
  nodeEnv: "production"
  configMapName: "gourmet-flow-config"
  existingSecretName: "gourmet-flow-secrets"
  jwtAccessExpiration: "15m"
  jwtRefreshExpiration: "7d"
# Do not commit real Neon URLs, passwords, JWT secrets, or API credentials.
# Create this secret outside Helm, then let Argo CD deploy workloads that read it.
# Required keys:
# - JWT_SECRET
# - JWT_REFRESH_SECRET
# - AUTH_DATABASE_URL
# - USER_DATABASE_URL
# - RESTAURANT_DATABASE_URL
# - MENU_DATABASE_URL
# - CART_DATABASE_URL
# - ORDER_DATABASE_URL
# - PAYMENT_DATABASE_URL
# - DELIVERY_DATABASE_URL
secrets:
  create: false
  existingSecretName: "gourmet-flow-secrets"
config:
  NODE_ENV: "production"
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"
  API_GATEWAY_URL: "http://api-gateway:4000"
  AUTH_SERVICE_URL: "http://auth-service:4001"
  USER_SERVICE_URL: "http://user-service:4002"
  RESTAURANT_SERVICE_URL: "http://restaurant-service:4003"
  MENU_SERVICE_URL: "http://menu-service:4004"
  CART_SERVICE_URL: "http://cart-service:4005"
  ORDER_SERVICE_URL: "http://order-service:4006"
  PAYMENT_SERVICE_URL: "http://payment-service:4007"
  DELIVERY_SERVICE_URL: "http://delivery-service:4008"
services:
  apiGateway:
    enabled: true
    name: api-gateway
    port: 4000
    replicas: 2
    serviceType: ClusterIP
    service:
      type: ClusterIP
      port: 4000
      targetPort: 4000
    image:
      repository: grabmyfood-production-api-gateway
      tag: "6"
      pullPolicy: IfNotPresent
    envVars:
      PORT: "4000"
    livenessProbe:
      enabled: true
      path: /health
      port: 4000
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /ready
      port: 4000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"
  authService:
    enabled: true
    name: auth-service
    port: 4001
    replicas: 2
    serviceType: ClusterIP
    service:
      type: ClusterIP
      port: 4001
      targetPort: 4001
    image:
      repository: grabmyfood-production-auth-service
      tag: "6"
