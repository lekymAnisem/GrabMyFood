      port: 80
      targetPort: 8080
    image:
      repository: grabmyfood-production-frontend
      tag: "4"
      pullPolicy: IfNotPresent
    envVars: {}
    livenessProbe:
      enabled: true
      path: /
      port: 8080
      initialDelaySeconds: 15
