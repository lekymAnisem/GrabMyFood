{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecretName | default .Values.global.existingSecretName | default .Values.global.secretName | default (printf "%s-secrets" (include "gourmet-flow.fullname" .)) }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "gourmet-flow.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: "{{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret }}"
  JWT_REFRESH_SECRET: "{{ required "secrets.jwtRefreshSecret is required when secrets.create=true" .Values.secrets.jwtRefreshSecret }}"

  AUTH_DATABASE_URL: "{{ required "secrets.authDatabaseUrl is required when secrets.create=true" .Values.secrets.authDatabaseUrl }}"
  USER_DATABASE_URL: "{{ required "secrets.userDatabaseUrl is required when secrets.create=true" .Values.secrets.userDatabaseUrl }}"
  RESTAURANT_DATABASE_URL: "{{ required "secrets.restaurantDatabaseUrl is required when secrets.create=true" .Values.secrets.restaurantDatabaseUrl }}"
  MENU_DATABASE_URL: "{{ required "secrets.menuDatabaseUrl is required when secrets.create=true" .Values.secrets.menuDatabaseUrl }}"
  CART_DATABASE_URL: "{{ required "secrets.cartDatabaseUrl is required when secrets.create=true" .Values.secrets.cartDatabaseUrl }}"
  ORDER_DATABASE_URL: "{{ required "secrets.orderDatabaseUrl is required when secrets.create=true" .Values.secrets.orderDatabaseUrl }}"
  PAYMENT_DATABASE_URL: "{{ required "secrets.paymentDatabaseUrl is required when secrets.create=true" .Values.secrets.paymentDatabaseUrl }}"
  DELIVERY_DATABASE_URL: "{{ required "secrets.deliveryDatabaseUrl is required when secrets.create=true" .Values.secrets.deliveryDatabaseUrl }}"
{{- end }}
