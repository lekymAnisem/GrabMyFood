{{- range $key, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $name := $svc.name | default $key }}
{{- $component := $key }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "gourmet-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gourmet-flow.name" $ }}
      app.kubernetes.io/component: {{ $component }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gourmet-flow.name" $ }}
        app.kubernetes.io/component: {{ $component }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      {{- if $svc.nginxConfigMap }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ $svc.nginxConfigMap }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "gourmet-flow.image" (dict "repository" $svc.image.repository "tag" $svc.image.tag "Values" $) }}
          imagePullPolicy: {{ $svc.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ $svc.port }}
              protocol: TCP
          {{- if $svc.envVars }}
          env:
            {{- range $envKey, $envVal := $svc.envVars }}
            - name: {{ $envKey }}
              value: "{{ $envVal }}"
            {{- end }}
          {{- end }}
          {{- if not $svc.skipEnvFrom }}
          envFrom:
            - configMapRef:
                name: {{ $.Values.global.configMapName | default (printf "%s-config" (include "gourmet-flow.fullname" $)) }}
            - secretRef:
                name: {{ $.Values.global.secretName | default (printf "%s-secrets" (include "gourmet-flow.fullname" $)) }}
          {{- end }}
          {{- if $svc.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessProbe.path }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $svc.livenessProbe.periodSeconds | default 15 }}
          {{- end }}
          {{- if $svc.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessProbe.path }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $svc.readinessProbe.periodSeconds | default 10 }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $svc.nginxConfigMap }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          {{- end }}
{{- end }}
{{- end }}
