apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gourmet-flow
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 630243422439.dkr.ecr.ap-southeast-2.amazonaws.com/grabmyfood-production-api-gateway:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: gourmet-flow-config
            - secretRef:
                name: gourmet-flow-secrets
          env:
            - name: PORT
              value: "4000"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: gourmet-flow
spec:
  selector:
    app: api-gateway
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
  type: ClusterIP
---
