apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gourmet-flow

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - backend.yaml
  - frontend-nginx-config.yaml
  - frontend.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: gourmet-flow
  app.kubernetes.io/part-of: gourmet-flow
