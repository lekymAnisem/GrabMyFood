apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-agent.fullname" . }}-config
data:
  AGENT_MODE: {{ .Values.agent.mode | quote }}
  AUTOMATIC_REMEDIATION: {{ .Values.agent.automaticRemediation | quote }}
  CLUSTER_NAME: {{ .Values.agent.clusterName | quote }}
  KUBERNETES_NAMESPACE: {{ .Values.agent.namespace | quote }}
  AWS_REGION: {{ .Values.agent.awsRegion | quote }}
  AWS_ACCOUNT_ID: {{ .Values.agent.awsAccountId | quote }}
  PROMETHEUS_URL: {{ .Values.agent.prometheusUrl | quote }}
  GRAFANA_URL: {{ .Values.agent.grafanaUrl | quote }}
  MODEL_PROVIDER: {{ .Values.agent.modelProvider | quote }}
  MODEL_NAME: {{ .Values.agent.modelName | quote }}
  OPENAI_BASE_URL: {{ .Values.agent.openaiBaseUrl | quote }}
