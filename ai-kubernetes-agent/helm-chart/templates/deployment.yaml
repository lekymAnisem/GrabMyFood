apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-agent.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ai-agent.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-agent.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-agent.name" . }}
    spec:
      serviceAccountName: {{ include "ai-agent.fullname" . }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "ai-agent.fullname" . }}-config
          env:
            - name: AUTH_TOKEN_FILE
              value: /var/run/secrets/agent/api-token
            - name: ALERTMANAGER_SHARED_SECRET_FILE
              value: /var/run/secrets/agent/alertmanager-secret
          volumeMounts:
            - name: agent-secrets
              mountPath: /var/run/secrets/agent
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: agent-secrets
          secret:
            secretName: {{ .Values.secretRefs.existingSecretName }}
