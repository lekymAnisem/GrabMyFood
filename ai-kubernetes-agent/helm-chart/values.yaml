replicaCount: 2

image:
  repository: 919651863390.dkr.ecr.ap-southeast-2.amazonaws.com/grabmyfood-ai-kubernetes-agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

agent:
  mode: recommend
  automaticRemediation: false
  clusterName: GrabMyFood-production
  namespace: gourmet-flow
  awsRegion: ap-southeast-2
  awsAccountId: "919651863390"
  prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring:9090
  grafanaUrl: ""
  modelProvider: "openai-compatible"
  modelName: "llama3-70b-8192"
  openaiBaseUrl: "https://api.groq.com/openai/v1"

secretRefs:
  existingSecretName: ai-kubernetes-agent-secrets
  authTokenKey: api-token
  alertmanagerSecretKey: alertmanager-secret
  openaiApiKey: openai-api-key

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s

ingress:
  enabled: false
  className: nginx
  host: ai-agent.example.com

scalingPolicies:
  api-gateway:
    minimumReplicas: 2
    maximumReplicas: 6
    maximumAutomaticIncrease: 2
    cooldownMinutes: 10
    automaticScalingAllowed: true
  auth-service:
    minimumReplicas: 2
    maximumReplicas: 5
    maximumAutomaticIncrease: 1
    cooldownMinutes: 10
    automaticScalingAllowed: true
  payment-service:
    minimumReplicas: 2
    maximumReplicas: 4
    maximumAutomaticIncrease: 1
    cooldownMinutes: 15
    automaticScalingAllowed: false
