apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grabmyfood-database-alerts
  namespace: monitoring
spec:
  groups:
    - name: grabmyfood.database
      rules:
        - alert: DatabaseConnectionsHigh
          expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL connection utilization is high
        - alert: DatabaseConnectionPoolExhausted
          expr: sum(db_pool_waiting_clients{namespace="gourmet-flow"}) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Database connection pool has waiting clients
        - alert: DatabaseSlowQueries
          expr: rate(pg_stat_statements_total_time_seconds[5m]) / clamp_min(rate(pg_stat_statements_calls_total[5m]), 1) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Database query latency is high
        - alert: DatabaseHighCPU
          expr: aws_rds_cpuutilization_average > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Database CPU is high
        - alert: DatabaseStorageLow
          expr: aws_rds_free_storage_space_average < 10737418240
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Database free storage is low
        - alert: DatabaseDeadlocksDetected
          expr: increase(pg_stat_database_deadlocks[10m]) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Database deadlocks detected
