apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grabmyfood-kubernetes-alerts
  namespace: monitoring
spec:
  groups:
    - name: grabmyfood.kubernetes
      rules:
        - alert: KubernetesPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{namespace="gourmet-flow",reason="CrashLoopBackOff"}[5m]) >= 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Pod is crash looping
        - alert: KubernetesPodNotReady
          expr: sum by (pod) (kube_pod_status_ready{namespace="gourmet-flow",condition="false"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Pod is not ready
        - alert: KubernetesPodFrequentRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="gourmet-flow"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Pod is restarting frequently
        - alert: KubernetesContainerOOMKilled
          expr: increase(kube_pod_container_status_last_terminated_reason{namespace="gourmet-flow",reason="OOMKilled"}[15m]) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Container was OOMKilled
        - alert: KubernetesDeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="gourmet-flow"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Deployment has unavailable replicas
        - alert: KubernetesDeploymentRolloutStuck
          expr: kube_deployment_status_observed_generation{namespace="gourmet-flow"} < kube_deployment_metadata_generation{namespace="gourmet-flow"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Deployment rollout appears stuck
        - alert: KubernetesPodPending
          expr: sum by (pod) (kube_pod_status_phase{namespace="gourmet-flow",phase="Pending"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Pod has been pending
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Node is not ready
        - alert: KubernetesNodeHighCPU
          expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node CPU is high
        - alert: KubernetesNodeHighMemory
          expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node memory is high
        - alert: KubernetesNodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Node reports disk pressure
        - alert: KubernetesNodeFilesystemAlmostFull
          expr: 1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node filesystem is almost full
        - alert: KubernetesCPUThrottlingHigh
          expr: sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="gourmet-flow"}[5m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="gourmet-flow"}[5m])) > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: CPU throttling is high
        - alert: KubernetesPodMemoryNearLimit
          expr: sum by (pod) (container_memory_working_set_bytes{namespace="gourmet-flow",container!=""}) / sum by (pod) (kube_pod_container_resource_limits{namespace="gourmet-flow",resource="memory"}) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Pod memory is near limit
        - alert: KubernetesHPAAtMaximum
          expr: kube_horizontalpodautoscaler_status_desired_replicas{namespace="gourmet-flow"} == kube_horizontalpodautoscaler_spec_max_replicas{namespace="gourmet-flow"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: HPA is at maximum replicas
        - alert: KubernetesHPAMetricsUnavailable
          expr: kube_horizontalpodautoscaler_status_condition{namespace="gourmet-flow",condition="ScalingActive",status="false"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: HPA metrics are unavailable
