apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grabmyfood-agent-alerts
  namespace: monitoring
spec:
  groups:
    - name: grabmyfood.agent
      rules:
        - alert: PrometheusTargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Prometheus target is down
        - alert: PrometheusRuleEvaluationFailure
          expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Prometheus rule evaluation failed
        - alert: AlertmanagerDeliveryFailure
          expr: increase(alertmanager_notifications_failed_total[5m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Alertmanager notification delivery failed
        - alert: ArgoCDApplicationOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Argo CD application is out of sync
        - alert: ArgoCDApplicationUnhealthy
          expr: argocd_app_info{health_status!="Healthy"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Argo CD application is unhealthy
