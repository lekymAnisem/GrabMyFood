apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grabmyfood-application-alerts
  namespace: monitoring
spec:
  groups:
    - name: grabmyfood.application
      rules:
        - alert: APIHighLatencyP95
          expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{namespace="gourmet-flow"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: API P95 latency is high
        - alert: APIHighLatencyP99
          expr: histogram_quantile(0.99, sum by (le, service) (rate(http_request_duration_seconds_bucket{namespace="gourmet-flow"}[5m]))) > 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: API P99 latency is high
        - alert: APIHighErrorRate
          expr: sum(rate(http_requests_total{namespace="gourmet-flow",status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{namespace="gourmet-flow"}[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: API 5xx error rate is high
        - alert: APIHighRequestTimeoutRate
          expr: sum(rate(http_requests_total{namespace="gourmet-flow",status="504"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace="gourmet-flow"}[5m])), 1) > 0.02
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: API timeout rate is high
        - alert: APIAvailabilityLow
          expr: 1 - (sum(rate(http_requests_total{namespace="gourmet-flow",status!~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{namespace="gourmet-flow"}[5m])), 1)) > 0.02
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: API availability is low
        - alert: IngressHighLatency
          expr: histogram_quantile(0.95, sum by (le, ingress) (rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace="gourmet-flow"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Ingress latency is high
        - alert: IngressHigh5xxRate
          expr: sum(rate(nginx_ingress_controller_requests{namespace="gourmet-flow",status=~"5.."}[5m])) / clamp_min(sum(rate(nginx_ingress_controller_requests{namespace="gourmet-flow"}[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Ingress 5xx rate is high
