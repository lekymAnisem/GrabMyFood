id: investigate-high-latency
description: Correlate ingress, API, service, resource, database, and deployment-change signals
risk: low
automaticExecutionAllowed: true
parameters:
  - namespace
  - service
action:
  - query P95 and P99 latency
  - query 5xx and timeout rates
  - query CPU throttling and memory pressure
  - query database connection utilization
  - inspect recent Argo CD sync status
verification:
  - evidence identifies capacity, dependency, database, or deployment-regression path
rollback:
  - not applicable
timeoutSeconds: 180
