id: rollback-deployment-with-approval
description: Roll back a Deployment to the previous ReplicaSet after human approval
risk: high
automaticExecutionAllowed: false
requiresApproval: true
parameters:
  - namespace
  - deployment
preChecks:
  - verify the previous ReplicaSet image is known
  - verify rollback reason is linked to incident evidence
  - verify approver identity
action:
  - perform Kubernetes rollback only as emergency temporary remediation
  - create follow-up GitOps pull request
verification:
  - rollout completes
  - availability recovers
  - incident metrics return below thresholds
rollback:
  - create a forward-fix GitOps change
timeoutSeconds: 900
