id: restart-unhealthy-pod
description: Restart one unhealthy Pod managed by a Deployment
risk: low
automaticExecutionAllowed: false
requiredConditions:
  - pod is managed by a Deployment
  - at least one healthy replica remains
  - restart rate threshold exceeded
  - no active rollout is running
parameters:
  - namespace
  - podName
preChecks:
  - verify controller ownership
  - verify healthy replica count
  - verify Argo CD is not actively syncing the workload
action:
  - delete selected Pod through Kubernetes API
verification:
  - replacement Pod becomes Ready
  - desired replicas are available
  - error rate does not increase
rollback:
  - stop further action and escalate if replacement Pod is not Ready before timeout
timeoutSeconds: 300
