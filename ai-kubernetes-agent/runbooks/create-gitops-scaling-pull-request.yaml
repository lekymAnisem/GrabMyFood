id: create-gitops-scaling-pull-request
description: Propose a permanent Helm values scaling change through GitOps
risk: medium
automaticExecutionAllowed: false
requiresApproval: true
parameters:
  - repository
  - branch
  - service
  - replicas
action:
  - create branch
  - update Helm values
  - open pull request with incident evidence
verification:
  - Argo CD syncs after merge
rollback:
  - revert pull request or open follow-up change
timeoutSeconds: 900
