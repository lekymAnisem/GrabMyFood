id: collect-node-diagnostics
description: Collect node condition, pressure signals, allocatable capacity, and affected Pods
risk: low
automaticExecutionAllowed: true
parameters:
  - nodeName
action:
  - read node
  - read metrics.k8s.io node usage
  - list pods scheduled on node
verification:
  - diagnostic bundle is attached to incident
rollback:
  - not applicable
timeoutSeconds: 120
