route:
  receiver: ai-kubernetes-agent
  group_by: ["namespace", "alertname", "deployment", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: ai-kubernetes-agent
    webhook_configs:
      - url: http://ai-kubernetes-agent.ai-agent:8080/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/ai-agent-webhook-token
